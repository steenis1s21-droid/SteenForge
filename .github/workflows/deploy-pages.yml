name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - publish-clean
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site content
        run: |
          mkdir -p public
          cp -r index.html styles.css app.js app.js.bak-encoding detail.js app-detail.html updates.json public/
          cp -r dist-web public/dist-web
          cp -r sleep-journal-web public/sleep-journal-web
          cp -r ApexCore_3.0.3_stable public/ApexCore_3.0.3_stable

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
